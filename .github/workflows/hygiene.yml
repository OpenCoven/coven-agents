name: hygiene

on:
  pull_request:
    types: [closed]
  schedule:
    # Mondays at 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  delete-merged-head:
    name: delete merged head branch
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the head branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "Refusing to delete main."
            exit 0
          fi
          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
            && echo "Deleted ${BRANCH}" \
            || echo "Already deleted: ${BRANCH}"

  reap-merged-branches:
    name: reap merged branches
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Merge state comes from `gh`, never from local ancestry. A squash-merged
      # branch is never an ancestor of main, so `git branch --merged` cannot
      # see it and every squash-merged branch would accumulate forever. This
      # is the same boundary contract the local hygiene CLI follows.
      - name: Delete branches whose pull request was merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The loop runs in a pipeline subshell, so results go to a file
          # rather than a variable that would not survive.
          : > reaped.txt

          gh pr list --state merged --limit 100 \
            --json number,headRefName,headRefOid \
            --jq '.[] | "\(.number) \(.headRefName) \(.headRefOid)"' \
          | while read -r num ref sha; do
              case "$ref" in
                main|master|"") continue ;;
              esac

              # Already gone, usually auto-deleted on merge. Nothing to do.
              current=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ref}" \
                          --jq '.object.sha' 2>/dev/null) || continue

              # The ref exists but has moved since the merge, so the branch
              # name was reused for new work. Deleting it would destroy
              # commits no pull request has seen. Fail closed.
              if [ "$current" != "$sha" ]; then
                echo "Skipping ${ref}: moved since #${num} merged."
                continue
              fi

              if gh api -X DELETE \
                   "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ref}" >/dev/null; then
                echo "Deleted ${ref} (#${num})"
                printf -- '- %s (#%s)\n' "$ref" "$num" >> reaped.txt
              fi
            done

          if [ ! -s reaped.txt ]; then
            echo "Nothing to reap."
            exit 0
          fi

          reaped=$(cat reaped.txt)
          printf 'Reaped:\n%s\n' "$reaped"
          {
            echo "Branches deleted on $(date -u +%Y-%m-%d):"
            echo ""
            printf '%s' "$reaped"
          } > body.md

          # Create the label if missing, otherwise the issue calls below fail
          # on a repository that has never run this workflow.
          gh label create branch-hygiene \
            --description "Rolling log of automatically reaped branches" \
            --color ededed 2>/dev/null || true

          existing=$(gh issue list --label branch-hygiene --state open \
                      --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "Branch hygiene log" \
              --label branch-hygiene --body-file body.md
          fi
