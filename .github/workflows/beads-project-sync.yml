name: beads project sync

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beads-project-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVEN_PROJECT_OWNER: OpenCoven
      COVEN_PROJECT_NUMBER: "10"
      DOLT_REMOTE_URL: https://doltremoteapi.dolthub.com/OpenCoven/coven-agents-beads

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install GitHub CLI 2.98.0
        env:
          GH_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_2.98.0_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz \
            --output "$archive"
          echo "$GH_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/gh_2.98.0_linux_amd64/bin:$PATH"
          echo "$RUNNER_TEMP/gh_2.98.0_linux_amd64/bin" >> "$GITHUB_PATH"
          gh_version="$(gh version | awk 'NR==1 { print $3 }')"
          test "$gh_version" = "2.98.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Set private Beads workspace
        run: echo "BEADS_WORKSPACE=$RUNNER_TEMP/coven-agents-beads" >> "$GITHUB_ENV"

      - name: Install Beads 1.2.2
        env:
          BEADS_SHA256: 8140098a51d3b81d5548d1c5e6db1a2d9930e5d141efe2a4bff7d079c4d321e8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/beads_1.2.2_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gastownhall/beads/releases/download/v1.2.2/beads_1.2.2_linux_amd64.tar.gz \
            --output "$archive"
          echo "$BEADS_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/beads-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/beads-bin"
          export PATH="$RUNNER_TEMP/beads-bin:$PATH"
          echo "$RUNNER_TEMP/beads-bin" >> "$GITHUB_PATH"
          bd version

      - name: Install Dolt 2.3.1
        env:
          DOLT_SHA256: 0a2a318f27c5e1088a2883038573c2054e00f356dc9752e74bca934f8321959a
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dolt-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/dolthub/dolt/releases/download/v2.3.1/dolt-linux-amd64.tar.gz \
            --output "$archive"
          echo "$DOLT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/dolt-linux-amd64/bin:$PATH"
          echo "$RUNNER_TEMP/dolt-linux-amd64/bin" >> "$GITHUB_PATH"
          dolt_version="$(dolt version | awk 'NR==1 { print $3 }')"
          test "$dolt_version" = "2.3.1"

      - name: Restore private Beads database
        env:
          DOLT_REMOTE_USER: ${{ secrets.DOLT_REMOTE_USER }}
          DOLT_REMOTE_PASSWORD: ${{ secrets.DOLT_REMOTE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$BEADS_WORKSPACE"
          if [ ! -d "$BEADS_WORKSPACE/.git" ]; then
            git -C "$BEADS_WORKSPACE" init --quiet
          fi
          if [ ! -d "$BEADS_WORKSPACE/.beads" ]; then
            bd -C "$BEADS_WORKSPACE" init \
              --non-interactive \
              --prefix coven-agents \
              --remote "$DOLT_REMOTE_URL" \
              --skip-agents \
              --skip-hooks
          fi
          remote_output="$(bd -C "$BEADS_WORKSPACE" dolt remote list)"
          printf '%s\n' "$remote_output" | grep -Eq '^origin([[:space:]]|$)'
          bd -C "$BEADS_WORKSPACE" dolt status > /dev/null
          bd -C "$BEADS_WORKSPACE" dolt pull

      - name: Preview reconciliation
        env:
          GH_TOKEN: ${{ secrets.COVEN_PROJECT_TOKEN }}
        run: pnpm beads:sync preview

      - name: Apply reconciliation
        env:
          GH_TOKEN: ${{ secrets.COVEN_PROJECT_TOKEN }}
        run: pnpm beads:sync apply
