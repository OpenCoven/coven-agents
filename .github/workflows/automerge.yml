name: automerge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: automerge
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependency metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor bumps
        if: >-
          steps.meta.outputs.update-type ==
            'version-update:semver-patch' ||
          steps.meta.outputs.update-type ==
            'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Label major bumps for human review
        if: >-
          steps.meta.outputs.update-type ==
            'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set +e
          output=$(gh pr edit "$PR_URL" --add-label needs-human-review 2>&1)
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -q "'needs-human-review' not found"; then
              echo "::warning::Label 'needs-human-review' not found; skipping label application."
            else
              echo "$output"
              exit "$status"
            fi
          fi
