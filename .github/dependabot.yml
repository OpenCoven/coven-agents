# Commit-pinned actions are only safe while something keeps the pins current,
# so the pins in .github/workflows are maintained here rather than by hand.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # One grouped PR for safe bumps instead of a trickle of individual ones.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # Declined 2026-08-23 as PRs #9 and #10. Closing a Dependabot pull request
    # is not a durable signal — it would have re-raised both the following
    # Monday. Minor and patch updates still flow, so fixes within the current
    # major still arrive; only the major jump is suppressed. Remove an entry
    # here when the upgrade is actually wanted.
    ignore:
      # No fixed release was available on 2026-11-22; keep trying newer releases.
      - dependency-name: katex
        versions:
          - "<=0.19.1"
      - dependency-name: zod
        versions:
          - "<=4.6.7"
      - dependency-name: lucide-react
        update-types:
          - version-update:semver-major
      - dependency-name: nanoid
        update-types:
          - version-update:semver-major
      # Declined 2026-08-23 as PRs #16 and #17.
      - dependency-name: motion
        update-types:
          - version-update:semver-major
      - dependency-name: lint-staged
        update-types:
          - version-update:semver-major
      # Declined 2026-08-24 as #22. Not our code: bumping shiki to 4 splits the
      # tree, because @streamdown/code resolves shiki 4 while streamdown still
      # resolves shiki 3, and their HighlightOptions are then structurally
      # incompatible. Remove this entry when streamdown supports shiki 4.
      - dependency-name: shiki
        update-types:
          - version-update:semver-major
      # Declined 2026-08-24 as #31. `motion` is the successor package to
      # `framer-motion` and its majors are already ignored above, so taking
      # framer-motion 13 would split one animation library across two majors
      # permanently. Remove both entries together, after the eight
      # framer-motion imports are migrated to motion/react.
      - dependency-name: framer-motion
        update-types:
          - version-update:semver-major
      # Declined 2026-08-24 as #32. It typechecks and tests clean; the problem
      # is that CI runs Node 24 while these types describe Node 26, so a
      # Node-26-only API would pass typecheck and fail at runtime. Remove this
      # and take the bump in the same change that moves CI to Node 26.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
